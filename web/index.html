<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Дух Грунгни: экран корабля</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="/css/page.css">
<link rel="stylesheet" href="/css/constructor.css">
<script type="importmap">
{"imports": {"three": "/build/vendor/three/build/three.module.js", "three/addons/": "/build/vendor/three/examples/jsm/"}}
</script>
</head>
<body>
<header id="bar">
  <span id="mode"><button data-mode="constructor" title="Собрать дерево построек: узлы, связи, тексты">Конструктор</button><button data-mode="game" title="Экран корабля: дерево из файла, заказы и ходы">Игра</button><button data-mode="ingame" title="Только экран корабля, в размере и масштабе игры на выбранном разрешении: без 3D и обзора цепочек. То же сохранение, что в «Игре»">Как в игре</button></span>
  <span id="ig_tools" class="bar-group ingame-only">
    <label title="Разрешение экрана игры">Экран <select id="ig_res"></select></label>
    <label title="Настройка игры «Масштаб интерфейса» (preferences.script.txt, ui_scale). Ниже 1440p игра интерфейс не увеличивает">UI <select id="ig_ui"></select></label>
    <span class="seg"><button id="ig_fit" title="Весь экран игры в окне (клавиша 0)">Вписать</button><button id="ig_one" title="Один пиксель игры — один пиксель монитора (клавиша 1)">1:1</button></span>
    <button id="ig_full" title="Во весь экран (F). Esc — назад. В 1:1 плашка прячется, P — показать">Во весь экран</button>
    <button id="ig_ruler" class="toggle" title="Размеры элементов в пикселях игры и сетка 100 px (L)">Линейка</button>
    <button id="ig_font" class="toggle" title="Шрифты старых раскладок страницы в размере игры: кегль игры 12 = 16 px (gameui.js). Выключено — как в режиме «Игра»">Шрифт игры</button>
    <label title="Эскизы раскладки экрана для сравнения. Игра сейчас — A">Раскладка <select id="ig_layout"></select></label>
    <button id="ig_report_btn" class="toggle" title="Сводка: сколько дерева видно и какого размера всё на каждом разрешении (R)">Сводка</button>
  </span>
  <span id="cx_tools"></span>
  <span class="bar-group game-only"><span class="tag">Проверка без игры</span>
    <span id="turn">Ход 1</span>
    <button id="end_turn" title="Кнопка игры: конец хода. Постройки идут на ход вперёд">Конец хода</button></span>
  <span id="debug" class="bar-group game-only">
    <button id="debug_toggle" class="debug" title="Отладочные кнопки страницы" aria-expanded="false">Отладка ▾</button>
    <span id="debug_tools">
      <button id="build_all" class="debug" title="Отладка: построить все постройки дерева сразу, без ходов и золота">Построить всё</button>
      <button id="build_to" class="debug" title="Отладка: сразу построить выбранную постройку и всё, что ей нужно, без ходов и золота">Построить до выбранной</button>
      <span class="debug-gold" title="Отладка: задать золото фракции">Золото:
        <input id="gold_value" type="number" min="0" step="100">
        <button id="gold_set" class="debug">Задать</button>
        <button class="debug gold_quick" data-gold="0">0</button>
        <button class="debug gold_quick" data-gold="500">500</button>
        <button class="debug gold_quick" data-gold="1000">1000</button>
        <button class="debug gold_quick" data-gold="6000">6000</button>
      </span>
      <button id="reset_all" class="debug" title="Отладка: забыть сохранённое состояние страницы и начать заново">Сбросить всё</button>
    </span>
  </span>
  <ul id="log" class="game-only"></ul>
</header>
<main>
  <section id="left"><div id="screen"></div><div id="overview"></div></section>
  <section id="right">
    <div id="view3d"></div>
    <div id="tools3d">
      <button id="view_port">Вид на порт</button>
      <button id="view_all">Общий вид</button>
      <button id="view_left">Левый борт</button>
      <button id="view_right">Правый борт</button>
      <button id="view_below">Снизу</button>
      <button id="view_top">Сверху</button>
      <button id="view_nose">Нос шара</button>
      <button id="view_rail">Борт стрелков</button>
      <button id="follow_crew" class="toggle">К месту экипажа</button>
      <span id="hull"></span>
    </div>
    <div id="loading">Загрузка модели…</div>
    <div id="no_ship" style="display:none"></div>
  </section>
</main>
<div id="constructor"></div>
<div id="ingame"><div id="ig_stage"><div id="ig_screen"><div id="ig_overlay"></div><div id="ig_label"></div></div></div><div id="ig_report"></div></div>
<script type="module" src="/js/main.js"></script>
</body>
</html>
